<style>
/* 3F red & gold — same look as the 3F Meatshop Delivery App */
:root{--red:#8E1B22;--red2:#B3191B;--red3:#D61F14;--rosel:#FDEDEC;--rose2:#F6B3B0;--gold:#F5C518;--goldl:#FFF6D1;
  --bg:#F6F1F0;--ink:#2A1614;--muted:#6E5D5A;--line:#E5D9D7;--soft:#FBF6F5;--green:#1c7a44;--gbg:#e1f2e7;--amber:#8A5A00;--abg:#FFF3D6;--bad:#B4231B;--badl:#FDECEA;--blue:#1d5fa8;--bbg:#e3edf9}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(180deg,#F3E6E4 0,#F6F1F0 260px);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(115deg,var(--red) 0,var(--red2) 70%,var(--red3) 100%);color:#fff;border-bottom:4px solid var(--gold);box-shadow:0 2px 10px rgba(110,20,20,.25);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{width:46px;height:46px;border-radius:10px;border:2px solid var(--gold);flex:none;background:#fff center/88% no-repeat}
.ttl{border-left:2px solid rgba(255,255,255,.25);padding-left:14px;line-height:1.15}
.ttl b{display:block;font-size:18px}
.ttl small{font-size:11px;color:var(--rose2);letter-spacing:1.2px;text-transform:uppercase}
.acct{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 12px;text-align:left;line-height:1.15;max-width:46vw}
.acct b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:12px;opacity:.85}
nav.bar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(110,20,20,.06)}
nav.bar .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav.bar button{background:none;border:0;border-bottom:3px solid transparent;color:var(--red);padding:12px 14px 9px;font-weight:700;font-size:15px;white-space:nowrap}
nav.bar button.on{border-bottom-color:var(--gold);background:var(--rosel)}
nav.bar .cnt{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
main{padding-top:18px;padding-bottom:110px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(110,20,20,.06)}
.card.gold{border-top:4px solid var(--gold)}
h2{margin:0 0 4px;color:var(--red);font-size:21px}
h3{margin:18px 0 8px;color:var(--red);font-size:16px}
.muted{color:var(--muted)}
.lead{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.hero .w{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .w:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--rosel) 0,rgba(253,237,236,0) 70%)}
.hero .big{width:110px;height:110px;flex:none;background:#fff center/contain no-repeat;position:relative;z-index:1}
.hero h1{margin:0 0 4px;font-size:24px;color:var(--red);position:relative;z-index:1}
.hero p{margin:0;color:var(--muted);position:relative;z-index:1}
.hero .del{background:linear-gradient(150deg,var(--red) 0,var(--red2) 100%);color:#fff;border-radius:14px;padding:18px 22px;border-top:5px solid var(--gold)}
.hero .del small{color:#F8D5D2;font-size:13px}
.hero .del .dd{display:block;font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 8px}
.hero .del span{display:block;font-size:13px;color:#FBE3E1;line-height:1.6}
.gpill{display:inline-block;background:var(--gold);color:var(--red);font-weight:800;border-radius:20px;padding:1px 10px;font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;border:1px solid #CDB9B6;border-radius:10px;padding:10px 12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--red);white-space:nowrap}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--rose2);min-width:0}
.prod.out{opacity:.6}
.prod .top{display:flex;gap:10px;align-items:flex-start}
.prod .em{width:44px;height:44px;flex:none;border-radius:11px;background:var(--rosel);display:grid;place-items:center;font-size:24px}
.prod b{display:block;font-size:16px;color:var(--ink);line-height:1.25}
.prod .cat{font-size:12px;color:var(--muted)}
.price{font-size:20px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.price small{font-size:13px;color:var(--muted);font-weight:600}
.price2{font-size:12.5px;color:var(--muted)}
.avail{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;align-self:flex-start;background:var(--gbg);color:var(--green)}
.avail.low{background:var(--abg);color:var(--amber)}.avail.none{background:var(--badl);color:var(--bad)}
.qrow{display:flex;gap:6px;align-items:center;margin-top:auto}
.step{display:flex;align-items:center;border:1px solid #CDB9B6;border-radius:10px;overflow:hidden;background:#fff}
.step button{border:0;background:var(--soft);width:38px;height:40px;font-size:20px;font-weight:800;color:var(--red)}
.step input{width:64px;border:0;text-align:center;font-weight:800;font-size:16px;height:40px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.add{flex:1;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;height:42px}
.add.in{background:var(--green)}
.add:disabled{background:#C9B3B0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:3px solid var(--gold);box-shadow:0 -3px 14px rgba(110,20,20,.15)}
.cartbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px}
.cartbar b{font-size:18px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;background:var(--red);color:#fff}
.btn:hover{background:var(--red2)}
.btn.gold{background:var(--gold);color:var(--red)}
.btn.sec{background:#fff;color:var(--red);border:1px solid #C9B3B0}
.btn.sm{padding:7px 12px;font-size:14px;font-weight:700}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #E6A79E}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;font-size:18px;padding:14px}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.in{width:100%;border:1px solid #CDB9B6;border-radius:10px;padding:11px 12px;background:#fff}
.in:focus,.search:focus{outline:3px solid rgba(229,72,77,.3);border-color:#E5484D}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:var(--badl);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.err:empty{display:none}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pays button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;line-height:1.25}
.pays button b{display:block;font-size:15px}.pays button small{color:var(--muted);font-size:12px}
.pays button.on{border-color:var(--red);background:var(--rosel);box-shadow:inset 0 0 0 1px var(--red)}

<body>
<header><div class="wrap">
  <div class="logo" id="logo"></div>
  <div class="ttl"><b>3F Meatshop</b><small>Fresh · Frozen · Fine Cuts — Order online</small></div>
  <button class="acct" id="acct"><b>Log in</b><small>or sign up</small></button>
</div></header>
<nav class="bar"><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="view"></main>
<div class="cartbar" id="cartbar" hidden><div class="wrap"><div style="flex:1;min-width:0"><span class="muted" id="cbn"></span><br><b id="cbt"></b></div><button class="btn gold" id="cbgo">Checkout →</button></div></div>
<div class="modal" id="m"><div class="sheet" id="mb"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 3F MEATSHOP — CUSTOMER ORDER SITE =====================
   Bulk buyers (KUI etc.): log in → monitor their orders only.
   Retail / wholesale buyers: browse products & available qty → cart → payment (COD / bank / e-wallet) → track.
   Orders are delivered the DAY AFTER they are placed.                                                        */
const KEY=window.APP_KEY||new URLSearchParams(location.search).get('k')||'';const SESS='shop3f_s';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>{n=Math.round((+n||0)*1000)/1000;return String(n)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pISO=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)};
const longDay=s=>{const d=pISO(s);return DOWL[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()};
const t12=ms=>{const d=new Date(ms);let h=d.getHours();const ap=h<12?'AM':'PM';h=h%12||12;return MON[d.getMonth()]+' '+d.getDate()+', '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap};
const api=(fn,...a)=>new Promise((res,rej)=>{if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a);return}
  if(!window.API_URL||/PASTE/.test(window.API_URL)){rej(new Error('No connection to the shop server'));return}
  fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
    .then(r=>r.json()).then(x=>{if(x&&'err' in x)rej(new Error(x.err));else res(x?x.ok:null)}).catch(e=>rej(new Error('No connection to the shop server')))});
const errMsg=e=>String(e&&e.message||e||'').replace(/^Error:\s*/,'');
const EMO={pork:'🐷',chicken:'🐔',beef:'🐄',seafood:'🐟',seafoods:'🐟',processed:'🥟',frozen:'🧊'};
const emo=c=>EMO[String(c).toLowerCase()]||(/sio|dump|samg|long|ham/i.test(c)?'🥟':'🥩');

let newsShown=null;const SEEN='shop3f_seen';let seen={};try{seen=JSON.parse(localStorage.getItem(SEEN)||'{}')||{}}catch(e){}
// what changed since the customer last looked (placed → confirmed → preparing → on the way → delivered / cancelled)
function news(){if(!orders||!me)return[];const k=me.id;return orders.filter(o=>{const st=stOf(o);const was=(seen[k]||{})[o.id];return was!==undefined&&was!==st.t})}
function markSeen(){if(!orders||!me)return;const m={};orders.forEach(o=>m[o.id]=stOf(o).t);seen[me.id]=m;try{localStorage.setItem(SEEN,JSON.stringify(seen))}catch(e){}}
let info=null,me=null,token=null,view='shop',cat='All',q='',cart={},orders=null,openId=null,pay='cod',proofId='',busy=false;
try{const s=JSON.parse(localStorage.getItem(SESS)||'null');if(s&&s.token){token=s.token;me=s.me}}catch(e){}
try{cart=JSON.parse(localStorage.getItem('shop3f_cart')||'{}')||{}}catch(e){cart={}}
const saveCart=()=>{try{localStorage.setItem('shop3f_cart',JSON.stringify(cart))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200)}
const isBulk=()=>me&&me.type==='bulk', isWs=()=>me&&me.type==='wholesale';
const priceOf=p=>isWs()?p.wholesale:p.retail;
const stepOf=p=>1;   // whole numbers only (1 kg, 2 kg … / 1 pack, 2 packs …)

/* ---------------- screens ---------------- */
function nav(){
  const n=Object.values(cart).reduce((a,b)=>a+(b>0?1:0),0),act=orders?orders.filter(o=>!(o.delivered||(o.online&&o.online.status==='cancelled'))).length:0;
  const nw=news().length;
  const ready=ptsReady();
  const T=(ic,l,c)=>`<i>${ic}</i><span>${l}</span>${c||''}`;
  const tabs=isBulk()?[['orders',T('📦','My orders',nw?`<span class="cnt">${nw} new</span>`:'')],['points',T('⭐','My points',ready?'<span class="cnt" style="background:#F5C518;color:#8E1B22">🎁</span>':'')],['acct',T('👤','Account')]]
    :[['shop',T('🛒','Shop')],['cart',T('🧺','Cart',n?`<span class="cnt">${n}</span>`:'')],['orders',T('📦','My orders',nw?`<span class="cnt">${nw} new</span>`:act?`<span class="cnt">${act}</span>`:'')],['info',T('ℹ️','How to order')],['acct',T('👤',me?'Account':'Log in')]];
  if(view==='login'&&me)view='acct';
  if(view!=='login'&&!tabs.some(t=>t[0]===view))view=tabs[0][0];
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('');
  $('#acct').innerHTML=me?`<b>${esc(me.name)}</b><small>${{bulk:'Bulk buyer',wholesale:'Wholesale',retail:'Retail'}[me.type]||''}</small>`:'<b>Log in</b><small>or sign up</small>';
}
function render(){
  nav();
  if(me&&me.mustChange){rFirstPin();cartBar();return}
  ({shop:rShop,cart:rCart,orders:rOrders,acct:rAcct,login:rLogin,info:rInfo,points:rPoints})[view]();
  cartBar();
}
function hero(){
  const s=info.set||{};
  return `<div class="hero"><div class="w"><div class="big" id="biglogo"></div><div><h1>Fresh · Frozen · Fine cuts</h1><p>${esc(s.note||'Order today — delivered tomorrow.')}</p></div></div>
    <div class="del"><small>Order today · delivered on</small><span class="dd">${longDay(info.delivery)}</span>
    <span>🎉 <b>FREE delivery for ${fmt(info.set.freeKg||5)} kg and up</b>${info.set.freeKg?'':''} · wholesale always free</span><span>💳 Cash on delivery · Bank transfer · GCash / Maya</span>${s.phone?`<span>📞 ${esc(s.phone)}</span>`:''}<span style="margin-top:6px"><button class="btn gold sm" data-v="info">ℹ️ How to order · delivery fees</button></span></div></div>`;
}
function rShop(){
  if(!info){$('#view').innerHTML='<div class="empty">Loading products…</div>';return}
  const cats=['All',...new Set(info.products.map(p=>p.cat))];
  const list=info.products.filter(p=>(cat==='All'||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
  $('#view').innerHTML=hero()+`<div class="tools"><input class="search" id="q" placeholder="🔍 Search a product" value="${esc(q)}"></div>
    <div class="chips" style="margin-bottom:12px">${cats.map(c=>`<button data-cat="${esc(c)}" class="${c===cat?'on':''}">${c==='All'?'All':emo(c)+' '+esc(c)}</button>`).join('')}</div>
    ${!me?`<div class="rule">💡 Prices shown: <b>Retail</b> (wholesale price below it). <b>Log in or sign up</b> to order — wholesale accounts get wholesale prices and free delivery.</div>`:isWs()?`<div class="rule">✅ Wholesale account — wholesale prices and <b>free delivery</b>${info.set.wsMin?' · minimum order '+peso(info.set.wsMin):''}.</div>`:''}
    ${list.length?`<div class="grid">${list.map(prodCard).join('')}</div>`:'<div class="empty">No products found.</div>'}`;
  setLogos();
  const qi=$('#q');qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;rShop();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
}
function prodCard(p){
  const inC=cart[p.code]||0,out=p.avail<1,low=!out&&p.avail<=(p.unit==='Kg'?5:5);
  return `<div class="prod${out?' out':''}" data-p="${esc(p.code)}"><div class="top"><span class="em">${emo(p.cat)}</span><div style="min-width:0"><b>${esc(p.name)}</b><span class="cat">${esc(p.cat)} · per ${p.unit==='Kg'?'kg':p.unit.toLowerCase()}${p.unit!=='Kg'&&p.kg?' ('+fmt(p.kg)+' kg)':''}</span></div></div>
    <div class="price">${peso(priceOf(p))}<small> / ${p.unit==='Kg'?'kg':p.unit.toLowerCase()}</small></div>
    ${!me&&p.wholesale&&p.wholesale!==p.retail?`<div class="price2">Wholesale ${peso(p.wholesale)}</div>`:''}
    <span class="avail${out?' none':low?' low':''}">${out?'Sold out':'Available: '+fmt(Math.floor(p.avail))+' '+(p.unit==='Kg'?'kg':p.unit.toLowerCase())}</span>
    ${isBulk()?'':`<div class="qrow"><div class="step"><button data-dec="${esc(p.code)}" ${out?'disabled':''}>−</button><input data-qty="${esc(p.code)}" type="number" inputmode="numeric" step="1" min="0" value="${inC||''}" placeholder="0" ${out?'disabled':''}><button data-inc="${esc(p.code)}" ${out?'disabled':''}>+</button></div>
      <button class="add${inC?' in':''}" data-add="${esc(p.code)}" ${out?'disabled':''}>${inC?'✓ In cart':'Add'}</button></div>`}</div>`;
}
const prod=c=>info&&info.products.find(p=>p.code===c);
function setQty(code,v){const p=prod(code);if(!p)return;v=Math.max(0,Math.round(+v||0));
  if(v>p.avail){v=Math.floor(p.avail);toast('Only '+fmt(Math.floor(p.avail))+' '+p.unit+' available')}
  if(v>0)cart[code]=v;else delete cart[code];saveCart();}
function cartLines(){return Object.entries(cart).map(([c,qty])=>{const p=prod(c);return p?{p,qty,amt:Math.round(qty*priceOf(p)*100)/100}:null}).filter(Boolean)}
function cartBar(){const L=cartLines(),b=$('#cartbar');if(!L.length||isBulk()||view!=='shop'){b.hidden=true;return}
  b.hidden=false;const k=cartKg(),f=freeKg();$('#cbn').textContent='🧺 '+L.length+' item'+(L.length>1?'s':'')+' · '+fmt(k)+' kg'+(!isWs()&&f?(k>=f?' · 🎉 FREE delivery':' · '+fmt(Math.round((f-k)*1000)/1000)+' kg more for FREE delivery'):'');$('#cbt').textContent=peso(L.reduce((a,l)=>a+l.amt,0));}
const cartKg=()=>Math.round(cartLines().reduce((a,l)=>a+l.qty*(l.p.kg||0),0)*1000)/1000;
const freeKg=()=>(info&&info.set&&info.set.freeKg)||0;
const isFree=()=>freeKg()>0&&cartKg()>=freeKg();
function feeOf(area){if(isWs())return 0;const a=info.areas.find(x=>x.area===area);if(!a)return undefined;return isFree()?0:a.fee}
function rCart(){
  if(!info){rShop();return}
  const L=cartLines();
  if(!L.length){$('#view').innerHTML=`<div class="card"><h2>🧺 Your cart is empty</h2><p class="lead">Add products from the shop.</p><button class="btn" data-v="shop">Go to shop</button></div>`;return}
  const sub=Math.round(L.reduce((a,l)=>a+l.amt,0)*100)/100;
  const area=$('#c-area')?$('#c-area').value:(me&&me.area)||'',fee=feeOf(area),s=info.set||{};
  const keep={addr:$('#c-addr')?$('#c-addr').value:(me&&me.address)||'',ref:$('#c-ref')?$('#c-ref').value:'',note:$('#c-note')?$('#c-note').value:''};
  $('#view').innerHTML=`<div class="card gold"><h2>🧺 Checkout</h2><p class="lead">3 quick steps: check your items → delivery → payment.</p><div class="stepno">1 · Your items</div>
    ${L.map(l=>`<div class="line"><div><b>${esc(l.p.name)}</b><br><span class="muted">${peso(priceOf(l.p))} / ${l.p.unit==='Kg'?'kg':l.p.unit.toLowerCase()} · available ${fmt(l.p.avail)}</span></div>
      <div class="step"><button data-dec="${esc(l.p.code)}">−</button><input data-qty="${esc(l.p.code)}" type="number" inputmode="numeric" step="1" value="${l.qty}"><button data-inc="${esc(l.p.code)}">+</button></div>

function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=u})}
async function placeOrder(){
  if(busy)return;const L=cartLines(),e=$('#perr');e.textContent='';

  if(!x.address){e.textContent='Type your delivery address';return}

  busy=true;$('#place').disabled=true;$('#place').textContent='Placing order…';
  try{const o=await api('shop_place',token,x);cart={};saveCart();proofId='';orders=null;
    openM(`<div style="text-align:center"><div style="font-size:54px">✅</div><h2>Order placed!</h2><p class="lead">Order no. <b>${esc(o.online.no)}</b><br>Delivery on <b>${longDay(o.delivery)}</b></p>
      <p>${o.online.pay==='cod'?'⏳ Our sales team will <b>call or text you to confirm</b> your order.':'⏳ Our sales team will check your payment and confirm your order.'}<br>We confirm orders the <b>next morning</b>, then prepare and deliver them the same day.</p><p class="muted">📞 Our rider will call or text you once your order is out for delivery.</p>

}

/* ---------------- my orders ---------------- */
function stOf(o){
  const ol=o.online;
  if(ol&&ol.status==='cancelled')return{k:'x',t:'Cancelled',n:-1};
  if(o.delivered&&o.delivered.result)return{k:'x',t:o.delivered.result==='returned'?'↩️ Returned':'✕ Cancelled at delivery',n:0};
  if(o.delivered)return{k:'done',t:'✅ Delivered',n:5};
  if(o.dispatched)return{k:'way',t:'🚚 Out for delivery',n:4};
  if(ol&&ol.status==='pending')return{k:'pend',t:(ol.calls&&ol.calls.length)?'📞 We tried to call you':ol.pay==='cod'?'⏳ Waiting for confirmation':'⏳ Checking payment',n:1};
  if(o.prepDone&&o.checked)return{k:'ready',t:'✅ Packed & ready',n:3};
  if(ol&&ol.status==='confirmed')return{k:'prep',t:'🔪 Preparing',n:3};
  if(o.prepStarted)return{k:'prep',t:'🔪 Preparing',n:3};
  return{k:'conf',t:ol?'Confirmed':'Order received',n:ol?2:1};
}

     ${o.delivered&&o.delivered.result?`<p style="margin:4px 0 0;color:#B3191B"><b>${o.delivered.result==='returned'?'↩️ Returned':'✕ Cancelled'}</b> ${t12(o.delivered.at)}${o.delivered.why?' — reason: <b>'+esc(o.delivered.why)+'</b>':''}<br><span style="color:#555">Questions? Please call or text the shop${info&&info.set&&info.set.phone?' ('+esc(info.set.phone)+')':''}.</span></p>`:o.delivered?`<p style="margin:4px 0 0">✅ Delivered <b>${t12(o.delivered.at)}</b>${o.delivered.receiver?' · received by '+esc(o.delivered.receiver):''}</p>`:''}
     ${(o.dispatched&&o.dispatched.photo)||(o.delivered&&o.delivered.photo)?`<div class="photos">${o.dispatched&&o.dispatched.photo?`<figure><img data-ph="${esc(o.dispatched.photo)}" alt="Dispatch photo">Packed &amp; dispatched</figure>`:''}${o.delivered&&o.delivered.photo?`<figure><img data-ph="${esc(o.delivered.photo)}" alt="Delivery photo">Delivered</figure>`:''}</div>`:''}
     ${ol&&ol.status==='cancelled'?`<p class="tag t-bad" style="margin-top:10px">Cancelled${ol.cancelledBy?' by '+esc(ol.cancelledBy==='Customer'?'you':'the shop'):''}${ol.why?' — '+esc(ol.why):''}</p>`:''}
     <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${ol&&!isBulk()?`<button class="btn sm" data-again="${o.id}">🔁 Order these again</button>`:''}${canCancel?`<button class="btn danger sm" data-cancel="${o.id}">Cancel this order</button>`:''}</div>
   </div></div>`;
}
const pcache={};
function fillPhotos(){document.querySelectorAll('img[data-ph]').forEach(async im=>{const id=im.dataset.ph;try{if(!pcache[id])pcache[id]=await api('shop_photo',token,id);im.src=pcache[id]}catch(e){im.alt='Photo not available'}})}

/* ---------------- ⭐ points (bulk buyers) ---------------- */
let pts=null;
const ptsReady=()=>pts&&pts.claimable>0&&!pts.pending&&!pts.claimedThisMonth;
const monthName=s=>{const d=pISO(s);return ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]};
async function loadPoints(){if(!token||!isBulk())return;try{pts=await api('shop_points',token);nav();if(view==='points'&&!document.querySelector('.modal.on'))rPoints()}catch(e){}}
function ptsMessage(){
  const n=esc((me&&me.name)||'');
  if(pts.pending)return{ic:'🎁',t:`Your reward is on its way, ${n}!`,m:`We received your claim of <b>${pts.pending.pts} points (${peso(pts.pending.pts)})</b>. Our team will apply it to your next receipt. Thank you for growing with 3F Meatshop — partners like you are the reason we keep our cuts fresh and our service sharp. 🥩`};
  if(ptsReady()){const first=pts.today===pts.monthStart;
    return{ic:'🎉',t:first?`Happy 1st of ${monthName(pts.today)}, ${n}!`:`Your reward is ready, ${n}!`,m:`<b>Maraming salamat</b> for trusting 3F Meatshop with your kitchen. Every order you gave us earned you points — and today you have <b style="font-size:20px">${pts.claimable} points = ${peso(pts.claimable)}</b> ready to claim! Every box we pack is prepared with you in mind. Tap <b>Claim my points</b> and enjoy the reward — you truly deserve it. ✨`}}
  if(pts.claimedThisMonth)return{ic:'💛',t:`Thank you, ${n}!`,m:`You already claimed your reward this month. Keep the orders coming — your next points will be ready on <b>${longDay(pts.nextClaim)}</b>. We appreciate every single delivery with you!`};
  return{ic:'⭐',t:pts.month?`You're earning, ${n}!`:`Welcome to 3F Rewards, ${n}!`,m:pts.month?`You have earned <b>${pts.month} point(s)</b> so far this month — they will be ready to claim on <b>${longDay(pts.nextClaim)}</b>. Every ₱500 = 1 point = ₱1. Salamat for every order — we love serving you!`
    :`Every <b>₱500</b> of delivered orders earns <b>1 point = ₱1</b>, based on your POS receipt. Points are added after each delivery and can be claimed every <b>1st day of the month</b>. Thank you for being our partner!`};
}
function rPoints(){
  if(!isBulk()){view='shop';render();return}
  if(!pts){$('#view').innerHTML='<div class="empty">Loading your points…</div>';loadPoints();return}
  const M=ptsMessage(),T={earn:'Earned',claim:'Claimed',redeemed:'Used'};
  $('#view').innerHTML=`<div class="card" style="background:linear-gradient(150deg,var(--red) 0,var(--red2) 100%);color:#fff;border:0;border-top:5px solid var(--gold);position:relative;overflow:hidden">
      <div style="position:absolute;right:-30px;top:-30px;font-size:140px;opacity:.12">⭐</div>
      <div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#F8D5D2">3F Rewards · ${esc(me.name)}</div>
      <div style="font-size:54px;font-weight:900;line-height:1.05;margin:6px 0">${pts.balance}<small style="font-size:20px;color:var(--gold)"> points</small></div>
      <div style="color:#FBE3E1">= <b>${peso(pts.balance)}</b> in rewards · 1 point per ₱500 · 1 point = ₱1</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><span class="gpill">Ready to claim: ${pts.claimable}</span><span class="gpill" style="background:#fff">This month: ${pts.month} → ready ${MON[pISO(pts.nextClaim).getMonth()]} 1</span></div></div>
    <div class="card gold"><div style="display:flex;gap:14px;align-items:flex-start"><span style="font-size:40px;line-height:1">${M.ic}</span><div><h2>${M.t}</h2><p style="margin:4px 0 0;line-height:1.6">${M.m}</p></div></div>
      ${ptsReady()?`<button class="btn gold wide" id="claim" style="margin-top:14px;font-size:20px">🎁 Claim my ${pts.claimable} points (${peso(pts.claimable)})</button>`:''}</div>
    <div class="card"><h2>🧾 Points history</h2><p class="lead">Points are added after each delivery, from your POS receipt. If items were returned, points follow the final receipt.</p>
      <table class="it"><thead><tr><th>Date</th><th>What</th><th class="r">Amount</th><th class="r">Points</th></tr></thead><tbody>
      ${pts.history.map(h=>`<tr><td>${h.type==='earn'&&h.delivery?longDay(h.delivery):t12(h.at)}</td><td>${T[h.type]||h.type}${h.receipt?' · POS #'+esc(h.receipt):''}${h.type==='claim'?' · <b>'+({pending:'being processed',redeemed:'used as discount ✓',rejected:'not approved — call the shop'}[h.status]||h.status)+'</b>':''}${h.note&&/Modified/.test(h.note)?'<br><span class="muted" style="font-size:12.5px">'+esc(h.note)+'</span>':''}</td>
        <td class="r">${h.type==='earn'?peso(h.amount):''}</td><td class="r"><b style="color:${h.type==='earn'?'var(--green)':'var(--red)'}">${h.type==='earn'?'+':'−'}${h.pts}</b></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No points yet — your first points come after your next delivery.</td></tr>'}</tbody></table></div>`;
  const c=$('#claim');if(c)c.onclick=async()=>{c.disabled=true;try{pts=await api('shop_claim',token);rPoints();nav();
    openM(`<div style="text-align:center"><div style="font-size:60px">🎁</div><h2>Claim received!</h2><p class="lead">Thank you, <b>${esc(me.name)}</b>! Your <b>${pts.pending?pts.pending.pts:''} points</b> will be applied to your next receipt.<br>We are so grateful to have you with us. 💛</p><button class="btn wide" data-close>Yay!</button></div>`)}catch(e){toast(errMsg(e));c.disabled=false}};
}

/* ---------------- account / login ---------------- */
function rAcct(){
  if(!me){view='login';rLogin();return}
  $('#view').innerHTML=`<div class="card gold"><h2>👤 ${esc(me.name)}</h2><p class="lead">${{bulk:'Bulk buyer — order monitoring',wholesale:'Wholesale account — wholesale prices & free delivery',retail:'Retail account'}[me.type]||''}</p>
    ${me.type==='retail'&&me.wantsWs?'<div class="rule">⏳ Your wholesale request is being reviewed by the shop. Until then retail prices apply.</div>':''}
    ${isBulk()?'':`<label class="f">Delivery address</label><textarea class="in" id="a-addr" rows="2">${esc(me.address)}</textarea>
      <label class="f">Barangay</label><select class="in" id="a-area"><option value="">—</option>${(info?info.areas:[]).map(a=>`<option${a.area===me.area?' selected':''}>${esc(a.area)}</option>`).join('')}</select>
      <button class="btn" id="a-save" style="margin-top:12px">Save address</button>`}
    <h3>🔒 Change PIN</h3>${pinForm()}
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn sec" id="a-out">Log out</button></div><div class="err" id="aerr"></div></div>`;
  wirePin(()=>toast('PIN changed'));
  if($('#a-save'))$('#a-save').onclick=async()=>{try{me=await api('shop_updateMe',token,{address:$('#a-addr').value,area:$('#a-area').value});keepSess();toast('Address saved')}catch(e){$('#aerr').textContent=errMsg(e)}};
  $('#a-out').onclick=()=>{logout();toast('Logged out')};
}
function pinForm(){return `<div class="two"><div><label class="f">Current PIN</label><input class="in" id="p-old" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"></div><div><label class="f">New 4-digit PIN</label><input class="in" id="p-new" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div></div>
  <label class="f">Type the new PIN again</label><input class="in" id="p-new2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
  <button class="btn" id="p-go" style="margin-top:12px">Change PIN</button><div class="err" id="perr2"></div>`}
function wirePin(done){const b=$('#p-go');if(!b)return;b.onclick=async()=>{const e=$('#perr2');e.textContent='';const a=$('#p-old').value,n=$('#p-new').value,n2=$('#p-new2').value;
  if(n!==n2){e.textContent='The new PINs do not match';return}
  b.disabled=true;try{me=await api('shop_changePin',token,a,n);keepSess();done()}catch(er){e.textContent=errMsg(er)}b.disabled=false}}
// first login with the PIN the shop gave → must choose their own PIN
function rFirstPin(){$('#view').innerHTML=`<div class="card gold" style="max-width:520px;margin:0 auto"><h2>🔒 Choose your own PIN</h2><p class="lead">Welcome, <b>${esc(me.name)}</b>! You logged in with the PIN given by 3F Meatshop. Please change it now so only your company knows it.</p>${pinForm()}
  <p class="muted" style="font-size:13px">Your username stays <b>${esc(me.login)}</b>.</p></div>`;
  $('#p-old').value='';wirePin(()=>{toast('PIN changed — welcome!');render();loadOrders()})}
let lmode='login';
function rLogin(){
  const areas=info?info.areas:[];
  $('#view').innerHTML=`<div class="card gold" style="max-width:520px;margin:0 auto 16px">
    <div class="chips" style="margin-bottom:12px"><button data-lm="login" class="${lmode==='login'?'on':''}">Log in</button><button data-lm="reg" class="${lmode==='reg'?'on':''}">Sign up (new customer)</button></div>
    ${lmode==='login'?`<h2>Log in</h2><p class="lead">Use your mobile no. (or the username given by the shop) and your 4-digit PIN.</p>
      <label class="f">Mobile no. / Username</label><input class="in" id="l-id" autocomplete="username" autocapitalize="off" placeholder="09XXXXXXXXX or username">
      <label class="f">PIN</label><input class="in" id="l-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••">
      <button class="btn wide" id="l-go" style="margin-top:14px">Log in</button>
      <p class="muted" style="font-size:13px">Bulk buyers (e.g. KUI): use the username and PIN given by 3F Meatshop — you will choose your own PIN after logging in.</p>`:
     `<h2>Sign up</h2><p class="lead">For retail and wholesale buyers.</p>
      <label class="f">Name / store name</label><input class="in" id="r-name">
      <div class="two"><div><label class="f">Mobile no.</label><input class="in" id="r-mob" inputmode="tel" placeholder="09XXXXXXXXX"></div><div><label class="f">Choose a 4-digit PIN</label><input class="in" id="r-pin" type="password" inputmode="numeric" maxlength="4"></div></div>
      <label class="f">Delivery address</label><textarea class="in" id="r-addr" rows="2"></textarea>
      <label class="f">Barangay (Santa Ana, Cagayan)</label><select class="in" id="r-area"><option value="">— choose your barangay —</option>${areas.map(a=>`<option>${esc(a.area)}</option>`).join('')}</select>
      <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px"><input type="checkbox" id="r-ws" style="width:auto;margin-top:4px"> I buy <b>wholesale</b> (store / restaurant / reseller). The shop will review — retail prices apply until approved.</label>
      <button class="btn wide" id="r-go" style="margin-top:14px">Create account</button>`}
    <div class="err" id="lerr"></div></div>`;
  if($('#l-go')){const go=async()=>{const e=$('#lerr');e.textContent='';try{const r=await api('shop_login',KEY,$('#l-id').value,$('#l-pin').value);setSess(r)}catch(er){e.textContent=errMsg(er)}};
    $('#l-go').onclick=go;$('#l-pin').onkeydown=k=>{if(k.key==='Enter')go()}}
  if($('#r-go'))$('#r-go').onclick=async()=>{const e=$('#lerr');e.textContent='';try{const r=await api('shop_register',KEY,{name:$('#r-name').value,mobile:$('#r-mob').value,pin:$('#r-pin').value,address:$('#r-addr').value,area:$('#r-area').value,wholesale:$('#r-ws').checked});setSess(r);toast('Welcome, '+r.me.name+'!')}catch(er){e.textContent=errMsg(er)}};
}
function keepSess(){try{localStorage.setItem(SESS,JSON.stringify({token,me}))}catch(e){}}
function setSess(r){token=r.token;me=r.me;keepSess();orders=null;view=isBulk()?'orders':Object.keys(cart).length?'cart':'shop';render();loadOrders()}
function logout(){if(token)api('shop_logout',token).catch(()=>{});token=null;me=null;orders=null;pts=null;lmode='login';try{localStorage.removeItem(SESS)}catch(e){}view='shop';render()}

/* ---------------- data ---------------- */
async function loadInfo(){try{info=await api('shop_info',KEY);for(const c of Object.keys(cart)){const p=prod(c);if(!p)delete cart[c];else if(cart[c]>p.avail){cart[c]=p.avail;if(!cart[c])delete cart[c]}}saveCart();if(['shop','cart','acct','login'].includes(view)&&!document.activeElement.matches('input,textarea,select'))render();else nav()}
  catch(e){if(/BADLINK/.test(errMsg(e))){document.body.innerHTML='<div style="font:18px system-ui;max-width:420px;margin:60px auto;text-align:center">🔒<h2>This link is not valid</h2><p>Please use the shop link from 3F Meatshop.</p></div>';return}
    $('#view').innerHTML=`<div class="empty">Can't reach the shop right now. Check your internet, then <a href="#" onclick="location.reload()">reload</a>.</div>`}}
async function loadOrders(){if(!token)return;if(isBulk())loadPoints();try{orders=await api('shop_orders',token);if(me&&!seen[me.id])markSeen();else if(me){const m=seen[me.id];orders.forEach(o=>{if(!(o.id in m))m[o.id]=stOf(o).t})}if(view==='orders'&&!document.querySelector('.modal.on')&&!(me&&me.mustChange))rOrders();nav()}catch(e){if(/AUTH/.test(errMsg(e))){logout();toast('Please log in again')}}}
if(token)api('shop_me',token).then(m=>{me=m;keepSess();nav()}).catch(e=>{if(/AUTH/.test(errMsg(e)))logout()});
setInterval(()=>{if(document.hidden)return;if(token)loadOrders();if(view==='shop')loadInfo()},60000);

/* ---------------- clicks ---------------- */
function openM(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
$('#m').addEventListener('click',e=>{if(e.target.id==='m'||e.target.closest('[data-close]'))$('#m').classList.remove('on')});
document.addEventListener('click',async e=>{
  const im=e.target.closest('img[data-ph]');if(im&&im.src){openM(`<div class="viewer"><img src="${im.src}"><p class="muted">${esc(im.alt)}</p><button class="btn sec" data-close>Close</button></div>`);return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v){if(d.v!=='orders')newsShown=null;view=d.v;if(view==='orders'&&me){orders=orders||null;loadOrders()}render();scrollTo(0,0);return}
  if(d.cat!==undefined){cat=d.cat;rShop();return}
  if(d.lm){lmode=d.lm;rLogin();return}
  if(d.inc||d.dec){const c=d.inc||d.dec,p=prod(c),st=stepOf(p),inp=document.querySelector(`[data-qty="${CSS.escape(c)}"]`);let v=+(inp&&inp.value)||cart[c]||0;v=d.inc?v+st:v-st;
    if(view==='cart'){setQty(c,v);rCart();cartBar();nav();return}
    v=Math.max(0,Math.min(Math.floor(p.avail),Math.round(v)));if(inp)inp.value=v||'';if(cart[c]){setQty(c,v);rShop();nav();cartBar()}return}
  if(d.add){const c=d.add,p=prod(c),inp=document.querySelector(`[data-qty="${CSS.escape(c)}"]`);let v=+(inp&&inp.value)||0;if(!v)v=stepOf(p)===0.5?1:1;
    setQty(c,v);rShop();nav();cartBar();toast('Added '+fmt(cart[c]||0)+' '+(p.unit==='Kg'?'kg':p.unit.toLowerCase())+' '+p.name);return}
  if(d.rm){delete cart[d.rm];saveCart();rCart();nav();return}
  if(d.pay){pay=d.pay;rCart();return}
  if(d.again){const o=orders.find(x=>x.id===d.again);if(!o||!info)return;let added=0,miss=[];
    o.items.forEach(i=>{const p=info.products.find(x=>x.name===i.product);if(!p||p.avail<=0){miss.push(i.product);return}const q=Math.min(+i.qty||0,p.avail);if(q>0){cart[p.code]=q;added++}if(q<i.qty)miss.push(i.product+' (only '+fmt(p.avail)+' left)')});
    saveCart();view='cart';render();scrollTo(0,0);toast(added?'Added '+added+' item(s) to your cart'+(miss.length?' · not available: '+miss.join(', '):''):'Those items are not available right now');return}
  if(d.open){openId=openId===d.open?null:d.open;rOrders();return}
  if(d.cancel){openM(`<h2>Cancel this order?</h2><p class="lead">The items go back to the shop's stock.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-close>Keep order</button><button class="btn danger" id="cx" data-id="${esc(d.cancel)}">Yes, cancel</button></div>`);return}
  if(b.id==='cx'){try{await api('shop_cancel',token,b.dataset.id);$('#m').classList.remove('on');toast('Order cancelled');orders=null;loadOrders();loadInfo()}catch(er){$('#m').classList.remove('on');toast(errMsg(er))}return}
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.qty;if(!c)return;const v=e.target.value;setTimeout(()=>{e={target:{value:v}};if(view==='cart'){setQty(c,e.target.value);rCart();nav();cartBar()}else if(cart[c]){setQty(c,e.target.value);rShop();nav();cartBar()}},0)});
$('#acct').onclick=()=>{view=me?'acct':'login';render()};
$('#cbgo').onclick=()=>{view='cart';render();scrollTo(0,0)};
function setLogos(){const l=window.LOGO_ICON,f=window.LOGO_FULL;if(l)$('#logo').style.backgroundImage=`url(${l})`;const b=$('#biglogo');if(b&&f)b.style.backgroundImage=`url(${f})`}
setLogos();render();loadInfo();if(token)loadOrders();
</script>
</body>
</html>
