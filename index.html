<style>
/* 3F red & gold — same look as the 3F Meatshop Delivery App */
:root{--red:#8E1B22;--red2:#B3191B;--red3:#D61F14;--rosel:#FDEDEC;--rose2:#F6B3B0;--gold:#F5C518;--goldl:#FFF6D1;
  --bg:#F6F1F0;--ink:#2A1614;--muted:#6E5D5A;--line:#E5D9D7;--soft:#FBF6F5;--green:#1c7a44;--gbg:#e1f2e7;--amber:#8A5A00;--abg:#FFF3D6;--bad:#B4231B;--badl:#FDECEA;--blue:#1d5fa8;--bbg:#e3edf9}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(180deg,#F3E6E4 0,#F6F1F0 260px);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(115deg,var(--red) 0,var(--red2) 70%,var(--red3) 100%);color:#fff;border-bottom:4px solid var(--gold);box-shadow:0 2px 10px rgba(110,20,20,.25);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{width:52px;height:52px;flex:none;background:transparent center/contain no-repeat}
.ttl{border-left:2px solid rgba(255,255,255,.25);padding-left:14px;line-height:1.15}
.ttl b{display:block;font-size:18px}
.ttl small{font-size:11px;color:var(--rose2);letter-spacing:1.2px;text-transform:uppercase}
.acct{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 12px;text-align:left;line-height:1.15;max-width:46vw}
.acct b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:12px;opacity:.85}
nav.bar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(110,20,20,.06)}
nav.bar .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav.bar button{background:none;border:0;border-bottom:3px solid transparent;color:var(--red);padding:12px 14px 9px;font-weight:700;font-size:15px;white-space:nowrap}
nav.bar button.on{border-bottom-color:var(--gold);background:var(--rosel)}
nav.bar .cnt{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
main{padding-top:18px;padding-bottom:110px}main#view{padding-bottom:110px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(110,20,20,.06)}
.card.gold{border-top:4px solid var(--gold)}
h2{margin:0 0 4px;color:var(--red);font-size:21px}
h3{margin:18px 0 8px;color:var(--red);font-size:16px}
.muted{color:var(--muted)}
.lead{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.hero .w{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .w:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--rosel) 0,rgba(253,237,236,0) 70%)}
.hero .big{width:110px;height:110px;flex:none;background:#fff center/contain no-repeat;position:relative;z-index:1}
.hero h1{margin:0 0 4px;font-size:24px;color:var(--red);position:relative;z-index:1}
.hero p{margin:0;color:var(--muted);position:relative;z-index:1}
.hero .del{background:linear-gradient(150deg,var(--red) 0,var(--red2) 100%);color:#fff;border-radius:14px;padding:18px 22px;border-top:5px solid var(--gold)}
.hero .del small{color:#F8D5D2;font-size:13px}
.hero .del .dd{display:block;font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 8px}
.hero .del span{display:block;font-size:13px;color:#FBE3E1;line-height:1.6}
.gpill{display:inline-block;background:var(--gold);color:var(--red);font-weight:800;border-radius:20px;padding:1px 10px;font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;border:1px solid #CDB9B6;border-radius:10px;padding:10px 12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--red);white-space:nowrap}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--rose2);min-width:0}
.prod.out{opacity:.6}
.prod .top{display:flex;gap:10px;align-items:flex-start}
.prod .em{width:44px;height:44px;flex:none;border-radius:11px;background:var(--rosel);display:grid;place-items:center;font-size:24px}
.prod b{display:block;font-size:16px;color:var(--ink);line-height:1.25}
.prod .cat{font-size:12px;color:var(--muted)}
.price{font-size:20px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.price small{font-size:13px;color:var(--muted);font-weight:600}
.price2{font-size:12.5px;color:var(--muted)}
.avail{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;align-self:flex-start;background:var(--gbg);color:var(--green)}
.avail.low{background:var(--abg);color:var(--amber)}.avail.none{background:var(--badl);color:var(--bad)}
.qrow{display:flex;gap:6px;align-items:center;margin-top:auto}
.step{display:flex;align-items:center;border:1px solid #CDB9B6;border-radius:10px;overflow:hidden;background:#fff}
.step button{border:0;background:var(--soft);width:38px;height:40px;font-size:20px;font-weight:800;color:var(--red)}
.step input{width:64px;border:0;text-align:center;font-weight:800;font-size:16px;height:40px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.add{flex:1;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;height:42px}
.add.in{background:var(--green)}
.add:disabled{background:#C9B3B0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:3px solid var(--gold);box-shadow:0 -3px 14px rgba(110,20,20,.15)}
.cartbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px}
.cartbar b{font-size:18px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;background:var(--red);color:#fff}
.btn:hover{background:var(--red2)}
.btn.gold{background:var(--gold);color:var(--red)}
.btn.sec{background:#fff;color:var(--red);border:1px solid #C9B3B0}
.btn.sm{padding:7px 12px;font-size:14px;font-weight:700}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #E6A79E}

<script>
/* ===================== 3F MEATSHOP — CUSTOMER ORDER SITE =====================
   Bulk buyers (KUI etc.): log in → monitor their orders only.
   Retail / wholesale buyers: browse products → cart → payment (COD / bank / e-wallet) → track.
   Orders are delivered the DAY AFTER they are placed.                                                        */
const KEY=window.APP_KEY||new URLSearchParams(location.search).get('k')||'';const SESS='shop3f_s';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>{n=Math.round((+n||0)*1000)/1000;return String(n)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pISO=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)};
const longDay=s=>{const d=pISO(s);return DOWL[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()};
const t12=ms=>{const d=new Date(ms);let h=d.getHours();const ap=h<12?'AM':'PM';h=h%12||12;return MON[d.getMonth()]+' '+d.getDate()+', '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap};
const api=(fn,...a)=>new Promise((res,rej)=>{
  // 3F ONLINE MEATSHOP on Supabase (fast). Set SB_URL + SB_KEY in config.js; blank = the old Google Apps Script server
  if(window.SB_URL&&window.SB_KEY&&!/PASTE/.test(window.SB_URL)){fetch(window.SB_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn.toLowerCase(),{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:window.SB_KEY},/^eyJ/.test(window.SB_KEY)?{Authorization:'Bearer '+window.SB_KEY}:{}),body:JSON.stringify({a})})
    .then(r=>r.json().then(x=>({ok:r.ok,x}))).then(({ok,x})=>{if(!ok)rej(new Error(x&&x.message||'Server error'));else if(x&&x.__err)rej(new Error(x.__err));else res(x)}).catch(()=>rej(new Error('No connection to the shop server')));return}
  if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a);return}
  if(!window.API_URL||/PASTE/.test(window.API_URL)){rej(new Error('No connection to the shop server'));return}
  fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
    .then(r=>r.json()).then(x=>{if(x&&'err' in x)rej(new Error(x.err));else res(x?x.ok:null)}).catch(e=>rej(new Error('No connection to the shop server')))});
const errMsg=e=>String(e&&e.message||e||'').replace(/^Error:\s*/,'');
const EMO={pork:'🐷',chicken:'🐔',beef:'🐄',seafood:'🐟',seafoods:'🐟',processed:'🥟',frozen:'🧊'};
const emo=c=>EMO[String(c).toLowerCase()]||(/sio|dump|samg|long|ham/i.test(c)?'🥟':'🥩');

let newsShown=null;const SEEN='shop3f_seen';let seen={};try{seen=JSON.parse(localStorage.getItem(SEEN)||'{}')||{}}catch(e){}
// what changed since the customer last looked (placed → confirmed → preparing → on the way → delivered / cancelled)
function news(){if(!orders||!me)return[];const k=me.id;return orders.filter(o=>{const st=stOf(o);const was=(seen[k]||{})[o.id];return was!==undefined&&was!==st.t&&!(/Preparing|Confirmed|Packed|For dispatch/.test(was)&&st.n===2)})}
function markSeen(){if(!orders||!me)return;const m={};orders.forEach(o=>m[o.id]=stOf(o).t);seen[me.id]=m;try{localStorage.setItem(SEEN,JSON.stringify(seen))}catch(e){}}
let pv=null,pq=1,TRK={code:'',o:null,err:'',busy:false};try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('p'))pv=h.get('p');if(h.get('t'))TRK.code=h.get('t')}catch(e){}
let info=null,me=null,token=null,view='shop',cat='All',q='',cart={},orders=null,openId=null,pay='cod',proofId='',busy=false;
try{const s=JSON.parse(localStorage.getItem(SESS)||'null');if(s&&s.token){token=s.token;me=s.me}}catch(e){}
try{cart=JSON.parse(localStorage.getItem('shop3f_cart')||'{}')||{}}catch(e){cart={}}
const saveCart=()=>{try{localStorage.setItem('shop3f_cart',JSON.stringify(cart))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200)}
const isBulk=()=>me&&me.type==='bulk', isWs=()=>me&&me.type==='wholesale';
const priceOf=p=>isWs()?p.wholesale:p.retail;
const stepOf=p=>1;   // whole numbers only (1 kg, 2 kg … / 1 pack, 2 packs …)

/* ---------------- screens ---------------- */
function nav(){
  const n=Object.values(cart).reduce((a,b)=>a+(b>0?1:0),0),act=orders?orders.filter(o=>!(o.delivered||o.closed||(o.online&&o.online.status==='cancelled'))).length:0;
  const nw=news().length;
  const ready=ptsReady();
  const T=(ic,l,c,sl)=>`<i>${nIco(ic)}</i><span class="lf">${l}</span><span class="ls">${sl||l}</span>${c||''}`;
  const oldPts=true,SHOW_CARD=false,card=SHOW_CARD&&me&&memOn?[['card',T('card','My card',mine&&mine.me.bal>0?`<span class="cnt" style="background:#F5C518;color:#8E1B22">${peso(mine.me.bal).replace('.00','')}</span>`:'')]]:[];
  const tabs=isBulk()?[['orders',T('orders','My purchases',nw?`<span class="cnt">${nw} new</span>`:'','My purchases')],...card,...(oldPts?[['points',T('points','My points',ready?'<span class="cnt" style="background:#F5C518;color:#8E1B22">🎁</span>':'','Points')]]:[]),['acct',T('acct','Account')]]
    :[['shop',T('shop','Shop')],['cart',T('cart','Cart',n?`<span class="cnt">${n}</span>`:'')],['orders',T('orders','My purchases',nw?`<span class="cnt">${nw} new</span>`:act?`<span class="cnt">${act}</span>`:'','My purchases')],...card,['info',T('info','How to order','','Help')],['acct',T('acct',me?'Account':'Log in')]];
  if(view==='login'&&me)view='acct';
  if(view!=='login'&&!tabs.some(t=>t[0]===view))view=tabs[0][0];
  annBar();
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('');
  $('#acct').innerHTML=me?`<b>${esc(me.name.split(' ')[0])}</b><small>${{bulk:'Bulk buyer',wholesale:'Wholesale',retail:'Retail'}[me.type]||''}</small>`:'<b>Log in<span class="lsx"> / Sign up</span></b>';
  $('#acct').classList.toggle('in',!!me);document.body.classList.toggle('bulk',!!isBulk());
  const hc=$('#hcnt');hc.hidden=!(nw||act);hc.textContent=nw?nw+' new':act;$('#htrack').classList.toggle('on',view==='orders');
}
let lastView=null;
function render(){
  nav();
  if(me&&me.mustChange){rFirstPin();cartBar();return}
  document.body.classList.toggle('vshop',view==='shop'&&!pv);
  ({shop:rShop,cart:rCart,orders:rOrders,acct:rAcct,login:rLogin,info:rInfo,points:rPoints,card:rCard})[view]();
  cartBar();
  const ak=view+(view==='shop'&&pv?':'+pv:'')+(info?1:0)+(view==='orders'&&orders?1:0);if(ak!==lastView){lastView=ak;animIn()}   // animate when the page changes or its data first arrives
}
// ✨ page animation: content slides + un-blurs in, headings sweep in with a motion trail, cards reveal as you scroll
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let rvObs=null;
function animIn(){if(RM)return;const v=$('#view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
  v.querySelectorAll('h1,h2').forEach((h,i)=>{h.classList.remove('sweep');void h.offsetWidth;h.style.animationDelay=(80+i*60)+'ms';h.classList.add('sweep')});
  if(rvObs)rvObs.disconnect();if(!('IntersectionObserver'in window))return;
  rvObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rvObs.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'});
  let k=0;v.querySelectorAll('.prod,.card,.order,.rule,.hero>div,.faq details').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight){el.style.setProperty('--d',Math.min(k++,10)*45+'ms')}el.classList.add('rv');rvObs.observe(el)})}
// 🛒 a little item flies from the product into the cart, then the Add button and the cart pop
function flyToCart(fr,ic,code){const nb=document.querySelector(`[data-add="${CSS.escape(code)}"]`);if(nb){nb.classList.remove('pop');void nb.offsetWidth;nb.classList.add('pop')}
  if(RM||!fr)return;const cb=$('#cartbar'),tgEl=(cb&&!cb.hidden&&$('#cbgo'))||document.querySelector('nav.bar button[data-v="cart"]');if(!tgEl)return;const to=tgEl.getBoundingClientRect();
  const f=document.createElement('div');f.className='fly';f.textContent=ic;f.style.left=(fr.left+fr.width/2-18)+'px';f.style.top=(fr.top+fr.height/2-18)+'px';document.body.appendChild(f);
  const dx=to.left+to.width/2-(fr.left+fr.width/2),dy=to.top+to.height/2-(fr.top+fr.height/2);
  const an=f.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-90}px) scale(1.25)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.35)`,opacity:.6}],{duration:720,easing:'cubic-bezier(.45,0,.25,1)'});
  an.onfinish=()=>{f.remove();tgEl.classList.remove('bump');void tgEl.offsetWidth;tgEl.classList.add('bump')}}
// 🎞 promo banners (slide by themselves every 6 s, swipe on phones) + the announcement strip on top
let bnI=0,bnHold=false;
function banners(){const s=info.set||{},f=fmt(s.freeKg||5),dd=longDay(info.delivery),A=AU_SLIDES;
  return [
   {c:'b-red',k:'Free delivery',h:'FREE<br>DELIVERY!',p:`For <b>${f} kg and up</b> · wholesale always free`,tag:`Min. ${f} kg`,art:A[2].svg,fl:['🥩','🍗','📦']},
   {c:'b-cream',k:'Order today',h:'ORDER NGAYON,<br>DELIVER BUKAS!',p:`Next delivery: <b>${esc(dd)}</b>`,tag:'Sariwa!',art:A[0].svg,fl:['🥩','🌿','⭐']},
   {c:'b-rose',k:'Fresh · Frozen · Fine cuts',h:'SKIP THE<br>PALENGKE!',p:'Sariwang karne, hatid sa pinto mo — walang pila, walang init.',tag:'Walang pila!',art:A[1].svg,fl:['🍖','🥓','🌿']}]}
function hero(){const B=banners();bnI%=B.length;
  const PH=window.BNPH=window.BNPH||{};   /* 📷 your own banner photo: upload banner1.jpg / banner2.jpg / banner3.jpg to the top of the GitHub repo */
  return `<div class="bn" id="bn" aria-roledescription="carousel">${B.map((b,i)=>`<div class="bn-s ${b.c}${i===bnI?' on':''}${PH[i]===true?' ph':''}" aria-hidden="${i!==bnI}">${PH[i]===false?'':`<img class="bn-ph" src="banner${i+1}.jpg" alt="" onload="BNPH[${i}]=true;this.parentNode.classList.add('ph')" onerror="BNPH[${i}]=false;this.remove()">`}
      <div class="bn-t"><small>${b.k}</small><h1>${b.h}</h1><p>${b.p}</p><button class="btn gold sm" data-v="info">How to order →</button></div>
      <div class="bn-a"><span class="fl f1">${b.fl[0]}</span><span class="fl f2">${b.fl[1]}</span><span class="fl f3">${b.fl[2]}</span>${b.art.replace('viewBox="0 0 600 560" preserveAspectRatio="xMidYMax slice"','viewBox="0 70 600 390" preserveAspectRatio="xMidYMid slice"')}<span class="bn-tag">${b.tag}</span></div></div>`).join('')}
    <button class="bn-nav prev" data-bn="-1" aria-label="Previous">‹</button><button class="bn-nav next" data-bn="1" aria-label="Next">›</button>
    <div class="bn-dots">${B.map((b,i)=>`<button data-bn-go="${i}" class="${i===bnI?'on':''}" aria-label="Banner ${i+1}"></button>`).join('')}</div></div>`}
function bnGo(n){const el=$('#bn');if(!el)return;const S=el.querySelectorAll('.bn-s'),D=el.querySelectorAll('.bn-dots button'),old=bnI;bnI=(n+S.length)%S.length;if(old===bnI)return;
  el.classList.toggle('back',n<old&&!(old===S.length-1&&bnI===0));const L=S[old];if(L){L.classList.add('leave');clearTimeout(L._t);L._t=setTimeout(()=>L.classList.remove('leave'),750)}
  S.forEach((x,i)=>{x.classList.toggle('on',i===bnI);x.setAttribute('aria-hidden',i!==bnI)});D.forEach((x,i)=>x.classList.toggle('on',i===bnI))}
function bnWire(){const el=$('#bn');if(!el)return;el.onmouseenter=()=>bnHold=true;el.onmouseleave=()=>bnHold=false;
  let x0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;bnHold=true},{passive:true});
  el.addEventListener('touchend',e=>{bnHold=false;if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)bnGo(bnI+(dx<0?1:-1))},{passive:true})}
setInterval(()=>{if(!bnHold&&!document.hidden&&!RM)bnGo(bnI+1)},6000);
function annBar(){const a=$('#ann');a.hidden=true;return;   // the moving announcement strip is switched off (cleaner shop)
  if(!info){a.hidden=true;return}const s=info.set||{};a.hidden=false;
  const t=`<span>🚚 Delivering in <b>Santa Ana, Cagayan</b></span><span>📅 Next delivery: <b class="g">${esc(longDay(info.delivery))}</b></span><span>🎉 FREE delivery for <b>${fmt(s.freeKg||5)} kg</b> and up</span>${s.phone?`<span>📞 ${esc(s.phone)}</span>`:''}`;
  if($('#annin').dataset.t!==t){$('#annin').dataset.t=t;$('#annin').innerHTML=`<div class="ann-row">${t}</div><div class="ann-row" aria-hidden="true">${t}</div>`}}
function rShop(){
  if(!info){$('#view').innerHTML='<div class="empty">Loading products…</div>';return}
  if(pv){if(String(pv).startsWith('b:')&&bun(String(pv).slice(2)))return rBundle();if(prod(pv))return rItem();pv=null}
  const cats=['All',...new Set(info.products.map(p=>p.cat))];
  const ql=q.trim().toLowerCase(),list=info.products.filter(p=>ql?(p.name+' '+p.cat).toLowerCase().includes(ql):(cat==='All'||p.cat===cat));
  $('#view').innerHTML=(ql?`<div class="srch-h"><b>${list.length} result${list.length===1?'':'s'} for “${esc(q.trim())}”</b><button class="btn sec sm" data-qclr>✕ Clear search</button></div>`:hero()+`
    ${!me?'':isWs()?`<div class="rule">✅ Wholesale account — wholesale prices and <b>free delivery</b>${info.set.wsMin?' · minimum order '+peso(info.set.wsMin):''}.</div>`:''}`)+`
    ${!ql?bunSection():''}${ql?'':`<div class="sec-h" id="prods"><small>Today's products</small><h2>Choose your fresh cuts</h2><p>Fresh &amp; frozen meat, prepared the day before and delivered to your door.</p><i>*Prices are per kg or per pack. Availability changes daily.</i>
      ${cats.length>2?`<div class="ctabs" role="tablist">${cats.map(c=>`<button data-cat="${esc(c)}" role="tab" aria-selected="${c===cat}" class="${c===cat?'on':''}">${c==='All'?'All':esc(c)}</button>`).join('')}</div>`:''}</div>`}
    ${list.length?`<div class="grid">${list.map(prodCard).join('')}</div>`:`<div class="empty">${ql?'No product matches “'+esc(q.trim())+'”. Try another word, like “pork” or “chicken”.':'No products found.'}</div>`}`;
  setLogos();bnWire();

}
function prodCard(p){
  const inC=cart[p.code]||0,out=p.avail<1;
  const ph=p.photo&&window.SB_URL?window.SB_URL.replace(/\/$/,'')+'/storage/v1/object/public/products/'+p.photo:'';
  const tint=['#FDECEA','#FFF3D6','#EAF4EC','#EDEBFA','#FCE9F1','#E8F1FA'][[...String(p.cat)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
  return `<div class="prod tile${out?' out':''}${ph?' hasph':''}" data-p="${esc(p.code)}"><div class="pimg${ph?'':' noph'}" style="${ph?'':'background:'+tint}">${ph?`<img src="${esc(ph)}" alt="${esc(p.name)}" loading="lazy" decoding="async" onerror="this.closest('.prod').classList.remove('hasph');this.parentNode.classList.add('noph');this.replaceWith(Object.assign(document.createElement('span'),{className:'em pem',textContent:'${emo(p.cat)}'}))">`:`<span class="em pem">${emo(p.cat)}</span>`}${out?'<span class="pso">Unavailable today</span>':''}</div>
    <div class="top"><div style="min-width:0"><b>${esc(p.name)}</b><span class="cat">${esc(p.cat)} · per ${p.unit==='Kg'?'kg':p.unit.toLowerCase()}${p.unit!=='Kg'&&p.kg?' ('+fmt(p.kg)+' kg)':''}</span></div></div>
    ${!me&&p.wholesale&&p.wholesale!==p.retail?`<div class="price2">Wholesale ${peso(p.wholesale)}</div>`:''}
    <div class="pbot"><div class="price">${peso(priceOf(p))}<small>/${p.unit==='Kg'?'kg':p.unit.toLowerCase()}</small></div>
      ${isBulk()?(out?'<span class="avail none">Unavailable today</span>':''):out?'<button class="add2 na" disabled>Unavailable today</button>':inC?`<div class="mstep" aria-label="In cart"><button data-dec="${esc(p.code)}" aria-label="Less">−</button><b>${fmt(inC)} ${uN(p,inC)}</b><button data-inc="${esc(p.code)}" aria-label="More">+</button></div>`

function stOf(o){
  const ol=o.online;
  if(ol&&ol.status==='cancelled')return{k:'x',t:'Cancelled',n:-1};
  if(o.closed)return{k:'x',t:'✕ Closed by the shop',n:-1};
  if(o.delivered&&o.delivered.result)return{k:'x',t:o.delivered.result==='returned'?'↩️ Returned':'✕ Cancelled at delivery',n:0};
  if(o.delivered)return{k:'done',t:'✅ Delivered',n:5};
  if(o.dispatched)return{k:'way',t:'🚚 Out for delivery',n:4};
  if(ol&&ol.status==='pending')return{k:'pend',t:(ol.calls&&ol.calls.length)?'📞 Call attempted — please answer':ol.pay==='cod'?'⏳ Waiting for confirmation':'⏳ Checking payment',n:1};
  if(o.prepDone&&o.checked)return{k:'ready',t:'📦 For dispatch',n:2};
  if(ol&&ol.status==='confirmed'&&ol.released===false&&!o.prepStarted)return{k:'conf',t:'📦 For dispatch',n:2};
  if(ol&&ol.status==='confirmed')return{k:'prep',t:'📦 For dispatch',n:2};
  if(o.prepStarted)return{k:'prep',t:'📦 For dispatch',n:2};
  return{k:'conf',t:ol?'Confirmed':'Order received',n:ol?2:1};
}

$('#m').addEventListener('click',e=>{if(e.target.id==='m'||e.target.closest('[data-close]'))$('#m').classList.remove('on')});
document.addEventListener('click',async e=>{
  const im=e.target.closest('img[data-ph]');if(im&&im.src){openM(`<div class="viewer"><img src="${im.src}"><p class="muted">${esc(im.alt)}</p><button class="btn sec" data-close>Close</button></div>`);return}
  const lm=e.target.closest('a[data-lm]');if(lm){e.preventDefault();lmode=lm.dataset.lm;rLogin();scrollTo(0,0);return}
  const pc=e.target.closest('.prod[data-p]');if(pc&&!e.target.closest('button,input,a,label')){openItem(pc.dataset.p);try{history.replaceState({pv:pc.dataset.p,back:1},'',location.href)}catch(er){}return}
  const b=e.target.closest('button,.head.sp');if(!b)return;const d=b.dataset;
  if('pback' in d){closeItem();return}
  if(d.pvar){const bk=history.state&&history.state.back;openItem(d.pvar,true);try{history.replaceState({pv:d.pvar,back:bk},'',location.href)}catch(er){}return}
  if(d.pq){pq=+d.pq;rItem();return}
  if(d.pstep){pq=Math.max(1,pq+(+d.pstep));rItem();return}
  if(d.badd){bunAdd(d.badd,b);if(view==='shop')rShop();return}
  if(d.padd){const p=prod(d.padd);if(!p)return;const fr=(document.querySelector('.pd-img img')||document.querySelector('.pd-img')).getBoundingClientRect();setQty(p.code,pq);nav();cartBar();flyToCart(fr,emo(p.cat),p.code);toast('🛒 '+fmt(cart[p.code]||0)+' '+uN(p,cart[p.code]||0)+' '+p.name+' in your cart');rItem();return}
  if(d.pshare){const p=prod(d.pshare),url=location.origin+location.pathname+location.search+'#p='+encodeURIComponent(d.pshare),t=p?p.name+' — '+peso(p.retail)+'/'+uOf(p)+' at 3F Meatshop':'3F Meatshop';
    try{if(navigator.share){await navigator.share({title:t,text:t,url});return}}catch(er){if(er&&er.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);toast('🔗 Link copied — paste it on Facebook or Messenger')}catch(er){prompt('Copy this link:',url)}return}
  if(d.bn){bnGo(bnI+(+d.bn));return}if(d.bnGo!==undefined){bnGo(+d.bnGo);return}
  if('qclr' in d){q='';$('#hq').value='';$('#hqx').hidden=true;rShop();scrollTo(0,0);return}
  if(d.v&&b.classList.contains('brand')&&q){q='';$('#hq').value='';$('#hqx').hidden=true}
  if(d.v){if(d.v!=='orders')newsShown=null;if(pv){pv=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(er){}}view=d.v;if(view==='orders'){PH=true;if(me){orders=orders||null;loadOrders()}}render();scrollTo(0,0);return}
  if(d.cat!==undefined){cat=d.cat;rShop();const y=$('#prods');if(y&&y.getBoundingClientRect().top<80)y.scrollIntoView({block:'start'});return}
  if(d.lm){lmode=d.lm;rLogin();return}
  if(d.inc||d.dec){const c=d.inc||d.dec,p=prod(c),st=stepOf(p),inp=document.querySelector(`[data-qty="${CSS.escape(c)}"]`);let v=+(inp&&inp.value)||cart[c]||0;v=d.inc?v+st:v-st;
    if(view==='cart'){setQty(c,v);rCart();cartBar();nav();return}
    v=Math.max(0,Math.min(Math.floor(p.avail),Math.round(v)));if(inp)inp.value=v||'';if(cart[c]){setQty(c,v);rShop();nav();cartBar()}return}
  if(d.add){const c=d.add,p=prod(c),inp=document.querySelector(`[data-qty="${CSS.escape(c)}"]`);let v=+(inp&&inp.value)||0;if(!v)v=stepOf(p)===0.5?1:1;
    const from=(b.closest('.prod')||b).querySelector('.pimg img')||(b.closest('.prod')||b).querySelector('.em');const fr=from?from.getBoundingClientRect():b.getBoundingClientRect();
    setQty(c,v);rShop();nav();cartBar();flyToCart(fr,emo(p.cat),c);toast('Added '+fmt(cart[c]||0)+' '+(p.unit==='Kg'?'kg':p.unit.toLowerCase())+' '+p.name);return}
  if(d.rm){delete cart[d.rm];saveCart();rCart();nav();return}
  if(d.pay){pay=d.pay;rCart();return}
  if(d.again){const o=orders.find(x=>x.id===d.again);if(!o||!info)return;let added=0,miss=[];
    o.items.forEach(i=>{const p=info.products.find(x=>x.name===i.product);if(!p||p.avail<=0){miss.push(i.product);return}const q=Math.min(+i.qty||0,p.avail);if(q>0){cart[p.code]=q;added++}if(q<i.qty)miss.push(i.product+' (not enough today)')});
    saveCart();view='cart';render();scrollTo(0,0);toast(added?'Added '+added+' item(s) to your cart'+(miss.length?' · not available: '+miss.join(', '):''):'Those items are not available right now');return}
  if(d.open){openId=openId===d.open?null:d.open;rOrders();return}
  if(d.trkcopy){const t=d.trkcopy,url=location.origin+location.pathname+'#t='+encodeURIComponent(t);try{await navigator.clipboard.writeText(t+' — track: '+url);toast('📋 Tracking no. '+t+' copied')}catch(er){prompt('Your tracking number:',t)}return}
  if(d.cancel){const W=['I changed my mind','I ordered the wrong item or quantity','I want a different delivery date','I found a better price elsewhere','Payment problem'];
    openM(`<h2>Cancel this order?</h2><p class="lead" style="margin-bottom:8px">Reason for cancelling <small class="muted">(required)</small></p>
    <div class="cxw">${W.map(w=>`<label><input type="radio" name="cxw" value="${esc(w)}"> ${esc(w)}</label>`).join('')}<label><input type="radio" name="cxw" value="other"> Other</label></div>
    <input class="in" id="cx-o" maxlength="200" placeholder="Type the reason" style="display:none;margin-top:8px">
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn sec" data-close>Keep order</button><button class="btn danger" id="cx" data-id="${esc(d.cancel)}" disabled>Yes, cancel</button></div>`);
    const val=()=>{const r=document.querySelector('#m input[name=cxw]:checked');return !r?'':r.value==='other'?$('#cx-o').value.trim():r.value};
    const chk=()=>{const r=document.querySelector('#m input[name=cxw]:checked');$('#cx-o').style.display=r&&r.value==='other'?'':'none';$('#cx').disabled=!val()};
    document.querySelectorAll('#m input[name=cxw]').forEach(x=>x.onchange=()=>{chk();if(x.value==='other')$('#cx-o').focus()});$('#cx-o').oninput=chk;return}
  if(b.id==='cx'){const r=document.querySelector('#m input[name=cxw]:checked'),why=!r?'':r.value==='other'?$('#cx-o').value.trim():r.value;if(!why)return;try{await api('shop_cancel',token,b.dataset.id,why);$('#m').classList.remove('on');toast('Order cancelled');orders=null;loadOrders();loadInfo()}catch(er){$('#m').classList.remove('on');toast(errMsg(er))}return}
});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.qty;if(!c)return;const v=e.target.value;setTimeout(()=>{e={target:{value:v}};if(view==='cart'){setQty(c,e.target.value);rCart();nav();cartBar()}else if(cart[c]){setQty(c,e.target.value);rShop();nav();cartBar()}},0)});
$('#acct').onclick=()=>{view=me?'acct':'login';render()};
$('#cbgo').onclick=()=>{view='cart';render();scrollTo(0,0)};
function setLogos(){const l=window.LOGO_ICON,f=window.LOGO_FULL;if(l)$('#logo').style.backgroundImage=`url(${l})`;const b=$('#biglogo');if(b&&f)b.style.backgroundImage=`url(${f})`}
setLogos();render();loadInfo();if(token)loadOrders();gReturn();
if(TRK.code){view='orders';render();trackGo()}
/* 🔍 search in the header (like Shopee): works from any page */
(function(){const hq=$('#hq'),hx=$('#hqx'),go=()=>{const g=document.querySelector('#view .grid,#view .empty');if(g)g.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})};
  hq.oninput=()=>{q=hq.value;hx.hidden=!q;if(pv||view!=='shop'){pv=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}view='shop';render();scrollTo(0,0)}else{rShop();if(q)scrollTo(0,0)}};
  $('#hsf').onsubmit=e=>{e.preventDefault();if(view!=='shop'||pv){hq.oninput()}hq.blur();go();return false};
  hx.onclick=()=>{hq.value='';hq.oninput();hq.focus()}})();

</script>
</body>
</html>
